<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Transcriber · Desktop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="brand">
        <h1>Transcriber</h1>
        <button id="theme" class="icon-btn" title="Toggle theme">Theme</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="files">Files</button>
        <button class="tab" data-tab="record">Record</button>
      </div>
    </header>

    <main class="content">
      <!-- Controls card -->
      <section class="card controls">
        <div class="row grid-2">
          <div class="col">
            <label for="language">Language</label>
            <select id="language">
              <option value="auto">Auto (detect)</option>
              <option value="en" selected>English</option>
              <option value="ar">Arabic</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="es">Spanish</option>
            </select>
          </div>
          <div class="col">
            <label for="sessionId">Session ID</label>
            <div class="session-row">
              <input id="sessionId" type="text" />
              <button id="regenSession" class="icon-btn" title="Regenerate">New</button>
            </div>
            <small class="hint">Streaming sessions only.</small>
          </div>
        </div>

        <!-- Files tab area -->
        <div class="row tab-panel" data-panel="files">
          <div class="col">
            <label>Audio file</label>
            <div id="fileCard" class="file-card">
              <input id="fileInput" type="file" accept="audio/*" hidden />
              <div class="file-row">
                <button id="pickFile" class="btn">Choose File</button>
                <span id="fileName" class="file-name">No file chosen</span>
              </div>
              <audio id="audioPreview" controls class="audio"></audio>
            </div>
          </div>
          <div class="col">
            <label for="summaryToggle">Summary</label>
            <label class="toggle"><input id="summaryToggle" type="checkbox" checked /> Generate with LLM</label>
          </div>
        </div>

        <!-- Record tab area -->
        <div class="row tab-panel hidden" data-panel="record">
          <div class="col">
            <label for="device">Input Device</label>
            <div class="device-row">
              <select id="device"></select>
              <button id="refreshDevices" class="icon-btn" title="Refresh">Refresh</button>
            </div>
          </div>
          <div class="col">
            <p class="hint">Make sure a loopback / microphone device is available.</p>
          </div>
        </div>

        <button id="action" class="btn primary">Transcribe</button>

        <details id="adv" class="advanced">
          <summary>Advanced Options</summary>
          <div class="adv-grid">
            <div>
              <label for="sr">Sample rate (Hz)</label>
              <input id="sr" type="number" value="16000" />
            </div>
            <div>
              <label for="frame">Frame (ms)</label>
              <input id="frame" type="number" value="20" />
            </div>
            <div>
              <label for="mode">Mode</label>
              <select id="mode">
                <option value="files" selected>Files</option>
                <option value="record">Record</option>
              </select>
            </div>
          </div>
        </details>

        <div id="status" class="status">Idle</div>
      </section>

      <!-- Output card -->
      <section class="card output">
        <div class="toolbar">
          <button id="copy" class="icon-btn" title="Copy transcript">Copy</button>
          <button id="clear" class="icon-btn" title="Clear transcript">Clear</button>
        </div>
        <textarea id="out" placeholder="Transcript will appear here…"></textarea>

        <article id="summaryCard" class="summary-card hidden">
          <header>
            <div class="summary-meta">
              <h2 id="summaryTitle">Summary</h2>
              <div id="summaryLang" class="summary-lang"></div>
            </div>
            <button id="saveSummary" class="icon-btn" title="Save summary" disabled>Save</button>
          </header>
          <section>
            <h3>Executive Summary</h3>
            <p id="summaryExec" class="summary-text"></p>
          </section>
          <section>
            <h3>Key Points</h3>
            <ul id="summaryKeyPoints"></ul>
          </section>
          <section>
            <h3>Action Items</h3>
            <ul id="summaryActions"></ul>
          </section>
        </article>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
